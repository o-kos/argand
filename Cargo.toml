[workspace]
resolver = "3"
members = ["crates/core", "crates/io", "crates/dsp", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# Warnings are errors here rather than on the command line, so a plain
# `cargo clippy` is as strict locally as it is in CI.
[workspace.lints.rust]
warnings = "deny"

# Maintainability lints, chosen one at a time. The pedantic, nursery and
# restriction groups are never enabled wholesale: they contain lints that
# contradict this codebase and each other, and a group grows silently on a
# toolchain bump. Thresholds live in clippy.toml.
[workspace.lints.clippy]
too_many_arguments = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
fn_params_excessive_bools = "warn"
manual_let_else = "warn"
redundant_else = "warn"
branches_sharing_code = "warn"
# These two enforce the shape of a suppression: it must be `expect`, so it fails
# once it stops being needed, and it must carry a reason. Whether the owner
# agreed to it is a review obligation no lint can check.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
argand-core = { path = "crates/core" }
argand-io = { path = "crates/io" }
argand-dsp = { path = "crates/dsp" }

ab_glyph = "0.2"
anyhow = "1.0"
bytemuck = "1.23"
clap = { version = "4.5", features = ["derive"] }
hsl = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.18"
memmap2 = "0.9"
rayon = "1.10"
realfft = "3.4"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["wav", "flac", "pcm"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
