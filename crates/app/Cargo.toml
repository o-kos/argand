[package]
name = "argand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signal editor and analyzer for real and complex signals"
repository = "https://github.com/o-kos/argand"

[[bin]]
name = "argand"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
source-toolkit = ["dep:source-image", "dep:source-gpui-kit"]
toolkit-test-support = ["source-toolkit", "source-gpui-kit/test-support"]

[dependencies]
argand-core.workspace = true
argand-dsp.workspace = true
argand-edit.workspace = true
argand-io.workspace = true
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
dirs.workspace = true
source-gpui-kit = { package = "gpui-kit", version = "0.9.1", optional = true }
source-image = { package = "image", version = "0.25", default-features = false, features = ["png"], optional = true }
icu_decimal.workspace = true
icu_provider.workspace = true
icu_locale_core.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
argand-core = { workspace = true, features = ["testutil"] }
argand-io = { workspace = true, features = ["testutil"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
