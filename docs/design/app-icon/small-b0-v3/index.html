<style>body{font:14px system-ui;background:#e7e9ed;color:#273244;margin:24px}

<h1>B0: experimental optical sizes</h1>
<p>Original raster reduction versus a vector redraw with flat colors, narrower ribbons and wider openings. Not an approved production master.</p>
<p>Each sample appears at its target CSS size and at 8× nearest-neighbor enlargement. Use 100% browser zoom.</p>
<h2>16 × 16</h2><section>
<div class="panel light"><div class="pair">
<figure><figcaption>Original</figcaption><img src="b0-original-16-light.png" width="16" height="16" alt="original, 16 px"><img class="zoom" src="b0-original-16-light.png" width="128" height="128" alt="8× pixel enlargement"></figure>
<figure><figcaption>Optical</figcaption><img src="b0-optical-16-light.png" width="16" height="16" alt="optical, 16 px"><img class="zoom" src="b0-optical-16-light.png" width="128" height="128" alt="8× pixel enlargement"></figure>
</div></div>
<div class="panel dark"><div class="pair">
<figure><figcaption>Original</figcaption><img src="b0-original-16-dark.png" width="16" height="16" alt="original, 16 px"><img class="zoom" src="b0-original-16-dark.png" width="128" height="128" alt="8× pixel enlargement"></figure>
<figure><figcaption>Optical</figcaption><img src="b0-optical-16-dark.png" width="16" height="16" alt="optical, 16 px"><img class="zoom" src="b0-optical-16-dark.png" width="128" height="128" alt="8× pixel enlargement"></figure>
</div></div>
</section>
