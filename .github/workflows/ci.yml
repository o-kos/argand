name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

# Supersede a Pull Request's earlier runs, but let a push to main finish so
# every commit on main keeps a recorded result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What GPUI links against. The runner has no GPU and cannot run the
      # application, but it still has to build it.
      - name: Install the system libraries GPUI needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libfontconfig-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The command list from CONTRIBUTING.md, in order. What a contributor
      # runs locally and what blocks the merge must stay the same four lines.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Strictness lives in [workspace.lints], not in a flag here.
      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

  # The application is the reason these two exist. A runner has no GPU, so
  # nothing here opens a window: what is covered is that the workspace builds
  # and that everything not needing one still passes.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked
