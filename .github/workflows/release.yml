name: Release

on:
  push:
    tags: ["v*"]

# Raised to write on the publishing job alone.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base needs both histories, so the tag's shallow fetch is not enough.
          fetch-depth: 0

      # A tag can be pushed at any commit, and branch protection does not reach
      # it. Without this, anyone able to create a tag could publish an official
      # Release built from code that never passed review.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Fails the release before anything is built if the tag disagrees with
      # the workspace version or the changelog has no section for it.
      - name: Verify the tag and collect the release notes
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" | tee release-notes.md

      - name: Test
        run: cargo test --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the archive contents
        run: |
          version=${GITHUB_REF_NAME#v}
          stem="aspec-$GITHUB_REF_NAME-${{ matrix.target }}"
          binary=aspec
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary=aspec.exe
          fi

          mkdir -p "staging/$stem"
          cp "target/${{ matrix.target }}/release/$binary" "staging/$stem/"
          cp README.md LICENSE CHANGELOG.md "staging/$stem/"

          # The shipped binary must report the version being released.
          reported=$("staging/$stem/$binary" --version)
          echo "$reported"
          [ "$reported" = "aspec $version" ] ||
            { echo "error: binary reports '$reported', expected 'aspec $version'" >&2; exit 1; }

          echo "stem=$stem" >> "$GITHUB_ENV"

      - name: Archive (tar.gz)
        if: runner.os == 'Linux'
        run: tar -czf "$stem.tar.gz" -C staging "$stem"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        run: 7z a -tzip "$stem.zip" "./staging/$stem"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Checksum the archives
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes/release-notes.md \
            --verify-tag \
            dist/*
