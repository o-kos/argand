name: Release

on:
  push:
    tags: ["v*"]

# Raised to write on the publishing job alone.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    # The image CI tests on, so the GPUI libraries come from the same sources.
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release-source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base needs both histories, so the tag's shallow fetch is not enough.
          fetch-depth: 0

      - name: Verify the release tag is on main
        id: release-source
        run: |
          export LC_ALL=C
          if [[ ! $GITHUB_REF =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "error: release requires a canonical vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          sha=$(git rev-parse "$GITHUB_REF^{commit}")
          test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$sha" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "error: $GITHUB_REF_NAME points at $sha, which is not on main" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Test Ubuntu source isolation
        run: python3 .github/scripts/test-ubuntu-packages.py

      # The workspace test builds the GUI, which links against these, exactly as in ci.yml.
      - name: Install the system libraries GPUI needs
        run: |
          sudo bash .github/scripts/install-ubuntu-packages.sh \
            /etc/apt/sources.list.d/ubuntu.sources \
            libasound2-dev \
            libfontconfig-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Fails the release before anything is built if the tag disagrees with
      # the workspace version or the changelog has no section for it.
      - name: Verify the tag and collect the release notes
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" | tee release-notes.md

      - name: Test
        run: cargo test --locked --features source-toolkit,toolkit-test-support

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install the system libraries GPUI needs
        if: runner.os == 'Linux'
        run: |
          sudo bash .github/scripts/install-ubuntu-packages.sh \
            /etc/apt/sources.list.d/ubuntu.sources \
            libasound2-dev \
            libfontconfig-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build the GUI and CLI
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          target_args=()
          if [ "${{ runner.os }}" = Windows ]; then
            target_args=(--target "${{ matrix.target }}")
          fi
          cargo build --release --locked --features source-toolkit -p argand -p argand-cli "${target_args[@]}"

      - name: Package and smoke-test the release builds
        run: |
          binary_dir=target/release
          if [ "${{ runner.os }}" = Windows ]; then
            binary_dir="target/${{ matrix.target }}/release"
          fi
          python=python3
          if [ "${{ runner.os }}" = Windows ]; then
            python=python
          fi
          "$python" .github/scripts/package-release.py \
            --binary-dir "$binary_dir" \
            --target "${{ matrix.target }}" --output dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Checksum the archives
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes/release-notes.md \
            --verify-tag \
            dist/*
